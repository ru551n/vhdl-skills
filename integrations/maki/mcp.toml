# Maki project MCP configuration.
#
# Maki supports stdio and HTTP MCP servers here. These servers are enabled by
# default. If one is not installed/configured correctly, Maki can continue
# with the remaining servers and the VHDL skills will use documented fallbacks.
#
# Tool definitions are deferred by Maki when the total count is above
# `defer_tools`; this keeps the VHDL toolchain context-efficient.
#
# `timeout` is the per-tool-call timeout in milliseconds (Maki allows
# 1..=300000). Long operations must fit inside it:
# - vunit-mcp's server-side run budget (VUNIT_MCP_TIMEOUT) is kept below the
#   300000 ms call timeout.
# - tsfpga-mcp's default synthesis timeout is 300 s (TSFPGA_MCP_TIMEOUT).
# - corvidex-mcp searches are fast, but a first sync/reindex of a repository
#   can take minutes.

defer_tools = 10

[mcp.corvidex-mcp]
command = ["uvx", "--from", "git+https://github.com/ru551n/corvidex-mcp.git", "corvidex-mcp"]
timeout = 300000
enabled = true

[mcp.vunit-mcp]
command = ["uvx", "--from", "git+https://github.com/ru551n/vunit-mcp.git", "vunit-mcp"]
# Set this to the directory containing the project's VUnit run.py.
# A relative path is resolved by the server/runtime according to its environment.
# Keep the server-side run budget below the 300000 ms call timeout above.
environment = { VUNIT_MCP_PROJECT_DIR = ".", VUNIT_MCP_TIMEOUT = "240" }
timeout = 300000
enabled = true

[mcp.peeper-mcp]
command = ["uvx", "--from", "git+https://github.com/ru551n/peeper-mcp.git", "peeper-mcp"]
# Reads are usually fast; 300000 ms leaves headroom for very large waveforms.
timeout = 300000
enabled = true

[mcp.tsfpga-mcp]
command = ["uvx", "--from", "git+https://github.com/ru551n/tsfpga-mcp.git", "tsfpga-mcp"]
# Its default synthesis timeout is 300 s; the call timeout must cover it.
timeout = 300000
enabled = true
