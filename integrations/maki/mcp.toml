# Maki project MCP configuration.
#
# VUnit runs, synthesis and waveform measurements no longer need MCP servers:
# the skills call `vhdl-tools` (skills/shared/bin/vhdl-tools) directly.
# corvidex-mcp stays an MCP server because it keeps a search index and
# language servers running between calls.
#
# `timeout` is the per-tool-call timeout in milliseconds (Maki allows
# 1..=300000). A first sync/reindex of a repository can take minutes.

defer_tools = 10

[mcp.corvidex-mcp]
command = ["uvx", "--from", "git+https://github.com/ru551n/corvidex-mcp.git", "corvidex-mcp"]
timeout = 300000
enabled = true
